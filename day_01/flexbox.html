<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container Example</title>

    <style>
        /* Applies to all divs */
        div {
            border: 1px solid red;
            margin: 10px;
            padding: 10px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        /* Container */
        #container {
            border: 2px solid black;
            width: 90%;
            height: 500px;
            margin: auto;
            padding: 20px;
            display: flex;
        }
    </style>
</head>
<body>

    <div id="container">
        <div>I am div 1</div>

        <div>I am div 2</div>

        <div>I am div 3</div>
    </div>

</body>
</html>
